<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20262b"/><stop offset="1" stop-color="#111518"/></linearGradient>
    <radialGradient id="glow" cx="1230" cy="230" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3858e9" stop-opacity="0.45"/><stop offset="0.6" stop-color="#3858e9" stop-opacity="0.08"/><stop offset="1" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/></filter>
    <clipPath id="frame"><rect width="1544" height="500"/></clipPath>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa50b5"/><stop offset="1" stop-color="#ff9a5a"/></linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a8f"/><stop offset="1" stop-color="#1a1f4a"/></linearGradient>
    <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15b8a6"/><stop offset="1" stop-color="#3858e9"/></linearGradient>
    <clipPath id="t1"><rect x="864" y="214" width="200" height="112" rx="10"/></clipPath>
    <clipPath id="t2"><rect x="1092" y="214" width="200" height="112" rx="10"/></clipPath>
    <clipPath id="t3"><rect x="1320" y="214" width="200" height="112" rx="10"/></clipPath>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="88" y="214" font-size="84" font-weight="700" fill="#fff" letter-spacing="-2">Videoteca</text>
    <text x="92" y="276" font-size="40" fill="#8c8f94">Video Library for Mux</text>
    <text x="92" y="346" font-size="31" fill="#c3c4c7">Upload, search and embed from WordPress.</text>
  </g>

  <!-- library panel, bleeding off the right edge -->
  <g clip-path="url(#frame)">
    <g filter="url(#shadow)"><rect x="820" y="64" width="800" height="380" rx="24" fill="#2a3035"/></g>
    <rect x="820" y="64" width="800" height="380" rx="24" fill="none" stroke="#3c434a" stroke-width="2"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="864" y="140" font-size="34" font-weight="700" fill="#fff">Mux Videos</text>

      <rect x="1150" y="102" width="370" height="60" rx="12" fill="#1d2327" stroke="#3858e9" stroke-width="3"/>
      <circle cx="1185" cy="129" r="11" fill="none" stroke="#c3c4c7" stroke-width="4"/>
      <path d="M1193 137 L1203 147" stroke="#c3c4c7" stroke-width="4" stroke-linecap="round"/>
      <text x="1220" y="142" font-size="27" fill="#fff">launch</text>
      <rect x="1306" y="116" width="3" height="32" fill="#fff"/>
      <line x1="820" y1="190" x2="1544" y2="190" stroke="#3c434a" stroke-width="2"/>

      <!-- card 1: ready -->
      <g clip-path="url(#t1)">
        <rect x="864" y="214" width="200" height="112" fill="url(#thumb1)"/>
        <circle cx="1030" cy="236" r="70" fill="#fff" fill-opacity="0.12"/>
        <path d="M955 252 L983 270 L955 288 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      </g>
      <rect x="1004" y="294" width="52" height="24" rx="5" fill="#000" fill-opacity="0.7"/>
      <text x="1030" y="312" font-size="17" fill="#fff" text-anchor="middle">0:42</text>
      <text x="864" y="362" font-size="22" font-weight="700" fill="#fff"><tspan fill="#9fb1ff">Launch</tspan> teaser</text>
      <text x="864" y="392" font-size="19" fill="#8c8f94">Oct 26 · 1080p</text>

      <!-- card 2: uploading -->
      <g clip-path="url(#t2)">
        <rect x="1092" y="214" width="200" height="112" fill="url(#thumb2)"/>
      </g>
      <text x="1192" y="264" font-size="19" fill="#fff" text-anchor="middle">Uploading 64%</text>
      <rect x="1116" y="284" width="152" height="8" rx="4" fill="#fff" fill-opacity="0.2"/>
      <rect x="1116" y="284" width="97" height="8" rx="4" fill="#3858e9"/>
      <text x="1092" y="362" font-size="22" font-weight="700" fill="#fff"><tspan fill="#9fb1ff">Launch</tspan> day recap</text>
      <text x="1092" y="392" font-size="19" fill="#8c8f94">Oct 27</text>

      <!-- card 3: ready -->
      <g clip-path="url(#t3)">
        <rect x="1320" y="214" width="200" height="112" fill="url(#thumb3)"/>
        <circle cx="1350" cy="320" r="64" fill="#fff" fill-opacity="0.1"/>
        <path d="M1411 252 L1439 270 L1411 288 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      </g>
      <rect x="1460" y="294" width="52" height="24" rx="5" fill="#000" fill-opacity="0.7"/>
      <text x="1486" y="312" font-size="17" fill="#fff" text-anchor="middle">1:58</text>
      <text x="1320" y="362" font-size="22" font-weight="700" fill="#fff"><tspan fill="#9fb1ff">Launch</tspan> keynote</text>
      <text x="1320" y="392" font-size="19" fill="#8c8f94">Oct 24 · 1080p</text>
    </g>
  </g>

  <!-- title toast, inside the frame -->
  <g filter="url(#shadow)"><rect x="700" y="404" width="318" height="68" rx="34" fill="#fff"/></g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <circle cx="740" cy="438" r="17" fill="#00ba37"/>
    <path d="M731 438 L737 444 L749 431" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="447" font-size="25" font-weight="700" fill="#1d2327">Title synced to Mux</text>
  </g>
</svg>
